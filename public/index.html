<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Football AI Analyst</title>

<link
rel="stylesheet"
href="style.css"
>

</head>

<body>

<header>

<h1>⚽ Football AI Analyst</h1>

<p>
Data-driven football predictions
</p>

</header>


<main>

<section class="top-card">

<h2>Today's Matches</h2>

<div class="controls">

<select id="leagueFilter">

<option value="all">
All Leagues
</option>

</select>

<button
onclick="loadFixtures()"
class="refresh-btn"
>
Refresh
</button>

</div>

</section>


<section
id="loading"
class="message hidden"
>

Loading today's matches...

</section>


<section
id="fixtures"
>

</section>


<section
id="empty"
class="message hidden"
>

No fixtures found for today.

</section>


<section
id="analysis"
class="hidden"
>

<button
onclick="closeAnalysis()"
class="back-btn"
>
← Back to Matches
</button>


<div class="analysis-card">

<h2 id="analysisMatch"></h2>

<p
id="analysisLeague"
class="league"
></p>


<div class="prediction-box">

<div class="label">
Correct Score Prediction
</div>

<div
id="correctScore"
class="big-score"
>
-
</div>

<div>
Model confidence:
<span id="confidence">
-
</span>
</div>

</div>


<div class="stats-card">

<h3>Expected Goals</h3>

<div
id="expectedGoals"
class="stat-line"
>
-
</div>

</div>


<div class="stats-card">

<h3>Match Result</h3>

<div
id="resultProbabilities"
class="probabilities"
>
</div>

</div>


<div class="stats-card">

<h3>Top Correct Scores</h3>

<div id="scores"></div>

</div>

</div>

</section>


<section
id="error"
class="error hidden"
></section>

</main>


<script src="app.js"></script>

</body>

  </html>
